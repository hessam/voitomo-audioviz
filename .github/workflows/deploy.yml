name: Deploy

# Runs only after CI passes on a push to main. Deploys the exact commit CI tested.
on:
  workflow_run:
    workflows: ["CI Quality Gate"]
    types: [completed]
    branches: [main]
  # Manual deploy or rollback of one commit already on origin/main.
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA on origin/main to deploy"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # The production environment requires a reviewer; see the PR description.
    environment: production
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.event.workflow_run.head_sha }}

      - name: Check deploy configuration
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          RESTART_CMD: ${{ vars.RESTART_CMD }}
          HEALTH_CMD: ${{ vars.HEALTH_CMD }}
        run: |
          missing=()
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER DEPLOY_DIR RESTART_CMD HEALTH_CMD; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Deploy not configured. Missing: ${missing[*]}. Add secrets under Settings > Secrets and variables > Actions > Secrets, and the rest under Variables."
            exit 1
          fi

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          RESTART_CMD: ${{ vars.RESTART_CMD }}
          HEALTH_CMD: ${{ vars.HEALTH_CMD }}
          SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Pass the deploy script on stdin so the server runs the version under test.
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' RESTART_CMD='$RESTART_CMD' HEALTH_CMD='$HEALTH_CMD' bash -s -- '$SHA'" \
            < scripts/deploy.sh
